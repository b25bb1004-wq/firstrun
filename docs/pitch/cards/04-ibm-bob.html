<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>IBM Bob as the Brain</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brand-paper: #f4e9dc;
      --brand-paper-2: #e9dccd;
      --brand-ink: #0d1030;
      --brand-ink-2: #55546c;
      --brand-blue: #2d4fa0;
      --brand-electric: #1f3bff;
      --brand-crack: #f0287a;
      --brand-line: #b9aa9c;
    }
    body {
      width: 1920px;
      height: 1080px;
      background: var(--brand-paper);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--brand-ink);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .bg-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--brand-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--brand-line) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
    }
    .logo {
      width: 280px;
      height: auto;
      margin-bottom: 32px;
      filter: drop-shadow(0 4px 8px rgba(13,16,48,0.15));
    }
    .main-text {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      max-width: 1400px;
      margin-bottom: 16px;
    }
    .main-text .highlight {
      color: var(--brand-blue);
    }
    .layers {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 40px 0 48px;
    }
    .layer {
      background: var(--brand-paper-2);
      border: 2px solid var(--brand-line);
      border-radius: 16px;
      padding: 24px 40px;
      font-size: 28px;
      font-weight: 600;
      color: var(--brand-ink);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(13,16,48,0.1);
    }
    .layer:nth-child(1) { border-color: var(--brand-electric); }
    .layer:nth-child(2) { border-color: var(--brand-blue); }
    .layer:nth-child(3) { border-color: var(--brand-electric); }
    .layer .num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: white;
    }
    .layer:nth-child(1) .num { background: var(--brand-electric); }
    .layer:nth-child(2) .num { background: var(--brand-blue); }
    .layer:nth-child(3) .num { background: var(--brand-electric); }
    .cost-template {
      background: var(--brand-paper-2);
      border: 2px dashed var(--brand-crack);
      border-radius: 16px;
      padding: 28px 48px;
      font-size: 32px;
      font-weight: 600;
      color: var(--brand-crack);
      margin-top: 24px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cost-template .label {
      color: var(--brand-ink-2);
      font-weight: 500;
    }
    .cost-template .value {
      color: var(--brand-crack);
    }
    .note {
      font-size: 20px;
      font-weight: 400;
      color: var(--brand-ink-2);
      text-align: center;
      max-width: 1000px;
      margin-top: 32px;
      line-height: 1.5;
    }
    .agent-row {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      font-size: 20px;
      font-weight: 600;
      color: var(--brand-ink-2);
      letter-spacing: 0.5px;
    }
    .agent-row span { white-space: nowrap; }
  </style>
</head>
