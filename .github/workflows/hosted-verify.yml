name: Hosted Verify

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repository (owner/name)'
        required: true
        type: string
      ref:
        description: 'Git ref (branch, tag, or commit SHA)'
        required: false
        type: string
      request_id:
        description: 'Unique request ID for correlation'
        required: true
        type: string

run-name: verify ${{ inputs.repo }} ${{ inputs.request_id }}

concurrency:
  group: hosted-verify-${{ github.event.inputs.request_id }}
  cancel-in-progress: false

permissions:
  contents: read   # read-only: actions/checkout must read this private repo; nothing else

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout FirstRun repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate repository input
        id: validate
        env:
          IN_REPO: ${{ github.event.inputs.repo }}
          IN_REF: ${{ github.event.inputs.ref }}
          IN_REQ: ${{ github.event.inputs.request_id }}
        run: |
          REPO="$IN_REPO"
          REF="$IN_REF"
          REQUEST_ID="$IN_REQ"

          # Validate repo format
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "error=Invalid repository format. Use owner/name." >> $GITHUB_OUTPUT
            exit 1
          fi

          # Validate ref format
          if [[ -n "$REF" && ! "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then
            echo "error=Invalid ref format" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Prevent path traversal
          if [[ "$REF" == *".."* ]]; then
            echo "error=Invalid ref format" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "artifact=${REPO//\//__}" >> $GITHUB_OUTPUT

      - name: Run FirstRun verify
        id: verify
        if: steps.validate.outputs.error == ''
        env:
          IN_REPO: ${{ steps.validate.outputs.repo }}
          IN_REF: ${{ steps.validate.outputs.ref }}
        run: |
          if [[ -z "$IN_REPO" ]]; then
            echo "Missing repo input"
            exit 1
          fi

          args=(verify "https://github.com/$IN_REPO" --brain rules --out run-out --ref "$IN_REF")
          # Remove empty ref
          if [[ -z "$IN_REF" ]]; then
            args=(verify "https://github.com/$IN_REPO" --brain rules --out run-out)
          fi
          echo "Running: node bin/firstrun.js ${args[@]}"
          node bin/firstrun.js "${args[@]}"
        continue-on-error: true

      - name: Find run directory
        id: find_run
        if: steps.validate.outputs.error == ''
        run: |
          # Use the explicit output directory
          RUN_DIR="run-out"
          if [[ ! -d "$RUN_DIR" ]]; then
            echo "error=No run directory found" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "run_dir=$RUN_DIR" >> $GITHUB_OUTPUT

      - name: Trim large log files
        if: steps.validate.outputs.error == '' && steps.find_run.outputs.run_dir != ''
        env:
          RUN_DIR: ${{ steps.find_run.outputs.run_dir }}
        run: |
          # Remove log files larger than 1MB to keep artifact size down
          find "$RUN_DIR" -name "*.log" -size +1M -delete 2>/dev/null || true
          find "$RUN_DIR" -name "*.ndjson" -size +5M -delete 2>/dev/null || true

      - name: Upload run artifact
        if: steps.validate.outputs.error == '' && steps.find_run.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: firstrun-verify-${{ steps.validate.outputs.artifact }}
          path: ${{ steps.find_run.outputs.run_dir }}
          retention-days: 7

      - name: Report failure
        if: steps.verify.outcome == 'failure' && steps.validate.outputs.error == ''
        run: |
          echo "FirstRun verify failed. Check the uploaded artifact for evidence."
          exit 1