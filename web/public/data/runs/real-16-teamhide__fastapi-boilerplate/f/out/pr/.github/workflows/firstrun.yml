name: FirstRun setup guard
on:
  pull_request:
    paths:
      - 'README*'
      - 'CONTRIBUTING*'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '.nvmrc'
      - '.node-version'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.python-version'
      - 'docker-compose*.yml'
      - 'compose*.yml'
      - '.env.example'
      - '.env.sample'
      - '.firstrun/plan.json'
      - '**/*.py'
      - 'src/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for setup drift and replay the verified plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx -y github:b25bb1004-wq/firstrun guard --base origin/${{ github.base_ref }} --replay --comment ${{ github.event.pull_request.number }}
