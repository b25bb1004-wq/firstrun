services:
  app:
    image: python:3.11.7
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
  mysql:
    image: mysql:8
    network_mode: service:app
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fastapi
      MYSQL_USER: fastapi
      MYSQL_PASSWORD: fastapi
