services:
  app:
    image: node:22
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
  mysql:
    image: mysql:8.0
    network_mode: service:app
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
