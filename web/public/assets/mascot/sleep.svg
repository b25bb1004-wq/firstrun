<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="humble-robot humble-robot-sleep" aria-label="HUMBLE Robot: Sleeping">
  <defs>
    <filter id="blur-sleep" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bloom-sleep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lines-sleep" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffc47a" opacity="0.09"/>
    </pattern>
    <clipPath id="scr-sleep"><rect x="46" y="34" width="108" height="80" rx="18"/></clipPath>
  </defs>
  <style>
    :root {
      --core: #ff9a3c; --hi: #ffc47a; --deep: #e0701c;
      --out: #3a1c0a; --screen: #2a1406; --blue: #2440ff; --pink: #ff2d87;
    }
    .halo { filter: url(#blur-sleep); opacity: 0.28; }
    .bot-body { transform-origin: 100px 238px; animation: hb-sleep-bob 3.2s ease-in-out infinite; }
    .scan { animation: hb-scan-faint 6s linear infinite; }
    .zzz-1 { animation: hb-zzz 3s ease-out infinite; }
    .zzz-2 { animation: hb-zzz 3s ease-out infinite 1s; }
    @keyframes hb-sleep-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    @keyframes hb-scan-faint {
      0% { opacity: 0.4; } 50% { opacity: 0.7; } 100% { opacity: 0.4; }
    }
    @keyframes hb-zzz {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      40% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(14px, -24px) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bot-body, .scan, .zzz-1, .zzz-2 { animation: none !important; }
      .zzz-1, .zzz-2 { display: none; }
    }
  </style>
  <g class="bot-body">
    <!-- Amber halo glow -->
    <g class="halo" fill="var(--core, #ff9a3c)">
      <rect x="32" y="20" width="136" height="108" rx="30"/>
      <ellipse cx="100" cy="170" rx="44" ry="40"/>
    </g>
    <!-- Legs (rubber hose) -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="9" stroke-linecap="round">
      <path d="M86 196 Q84 214 80 228"/>
      <path d="M114 196 Q116 214 120 228"/>
    </g>
    <g fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <ellipse cx="76" cy="231" rx="13" ry="7"/>
      <ellipse cx="124" cy="231" rx="13" ry="7"/>
    </g>
    <!-- Body & chest light -->
    <path d="M100 136 C128 136 140 158 138 178 C136 198 120 206 100 206 C80 206 64 198 62 178 C60 158 72 136 100 136Z" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
    <circle cx="100" cy="168" r="6" fill="var(--hi, #ffc47a)" opacity="0.6" filter="url(#bloom-sleep)"/>
    <!-- Arms resting -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round">
      <path d="M66 158 Q48 170 46 188"/>
      <path d="M134 158 Q152 170 154 188"/>
    </g>
    <g fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <circle cx="46" cy="192" r="9"/>
      <circle cx="154" cy="192" r="9"/>
    </g>
    <!-- Neck -->
    <rect x="88" y="124" width="24" height="14" rx="4" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Head: CRT screen -->
    <g id="head">
      <rect x="36" y="24" width="128" height="100" rx="28" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
      <rect x="46" y="34" width="108" height="80" rx="18" fill="var(--screen, #2a1406)"/>
      <g clip-path="url(#scr-sleep)">
        <g filter="url(#bloom-sleep)" stroke-linecap="round" fill="none">
          <!-- Asleep closed eyes -->
          <g fill="var(--hi, #ffc47a)" opacity="0.75">
            <ellipse cx="80" cy="74" rx="9" ry="2"/>
            <ellipse cx="120" cy="74" rx="9" ry="2"/>
          </g>
          <!-- Flat resting mouth -->
          <path d="M88 96 L112 96" stroke="var(--hi, #ffc47a)" stroke-width="3.5" opacity="0.75"/>
        </g>
        <rect class="scan" x="46" y="34" width="108" height="80" fill="url(#lines-sleep)"/>
      </g>
      <!-- Glass glare -->
      <rect x="54" y="40" width="30" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
    </g>
    <!-- Antenna with dim ball -->
    <g id="ant">
      <path d="M100 24 L94 4" stroke="var(--out, #3a1c0a)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="93" cy="2" r="8" fill="var(--hi, #ffc47a)" stroke="var(--out, #3a1c0a)" stroke-width="3" opacity="0.45" filter="url(#bloom-sleep)"/>
    </g>
  </g>
  <!-- Rising ZZZ particles -->
  <g fill="var(--hi, #ffc47a)" font-family="monospace" font-weight="700">
    <text class="zzz-1" x="145" y="45" font-size="13">z</text>
    <text class="zzz-2" x="160" y="32" font-size="16">Z</text>
  </g>
</svg>
