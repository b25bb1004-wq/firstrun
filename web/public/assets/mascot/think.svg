<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="humble-robot humble-robot-think" aria-label="HUMBLE Lamplighter: Think">
  <defs>
    <filter id="hb-blur-think" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="hb-disc-think" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc47a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff9a3c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-lantern-think" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffc47a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ff9a3c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e0701c" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="hb-body-think" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#dbd0be"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      --robot-core: #ff9a3c; --robot-hi: #ffc47a; --robot-deep: #e0701c;
      --robot-out: #2b2622; --robot-screen: #2a1406; --robot-blue: #2440ff; --robot-pink: #ff2d87;
    }
    .bot-think-float { animation: hb-think-float 2.8s ease-in-out infinite alternate; }
    .bot-head-think { animation: hb-think-tilt 2.4s ease-in-out infinite alternate; transform-origin: 100px 114px; }
    .antenna-ball-think { animation: hb-think-pulse 1.4s ease-in-out infinite alternate; }
    @keyframes hb-think-float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    @keyframes hb-think-tilt {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(6deg); }
    }
    @keyframes hb-think-pulse {
      0% { fill: #ff9a3c; }
      100% { fill: #4589ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bot-think-float, .bot-head-think, .antenna-ball-think { animation: none !important; }
    }
  </style>

  <!-- Hover disc on floor -->
  <ellipse cx="100" cy="236" rx="34" ry="6" fill="url(#hb-disc-think)"/>

  <g class="bot-think-float">
    <!-- Backpack (behind body) with agent cartridges -->
    <rect x="74" y="128" width="52" height="48" rx="8" fill="#242b35" stroke="var(--robot-out)" stroke-width="3"/>
    <rect x="78" y="134" width="7" height="12" rx="2" fill="#4589ff"/>
    <rect x="89" y="134" width="7" height="12" rx="2" fill="#8a3ffc"/>
    <rect x="100" y="134" width="7" height="12" rx="2" fill="#0072c3"/>
    <rect x="111" y="134" width="7" height="12" rx="2" fill="#fa4d56"/>
    <rect x="84" y="152" width="7" height="12" rx="2" fill="#1192e8"/>
    <rect x="95" y="152" width="7" height="12" rx="2" fill="#009d9a"/>

    <!-- Left Arm (resting) -->
    <path d="M62 144 Q46 166 52 188" fill="none" stroke="var(--robot-out)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="53" cy="189" r="8" fill="#f0e9dd" stroke="var(--robot-out)" stroke-width="2.5"/>

    <!-- Right Arm (raised to chin/cheek in thought) -->
    <path d="M138 144 Q158 132 138 116" fill="none" stroke="var(--robot-out)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="114" r="8" fill="#f0e9dd" stroke="var(--robot-out)" stroke-width="2.5"/>

    <!-- Capsule Body -->
    <rect x="58" y="122" width="84" height="92" rx="42" fill="url(#hb-body-think)" stroke="var(--robot-out)" stroke-width="3.5"/>

    <!-- Glowing Belly Lantern -->
    <path d="M74 168 C74 150 86 142 100 142 C114 142 126 150 126 168 C126 186 114 196 100 196 C86 196 74 186 74 168 Z"
          fill="url(#hb-lantern-think)" stroke="var(--robot-out)" stroke-width="2.5"/>
    <circle cx="100" cy="168" r="14" fill="#ffc47a" opacity="0.65" filter="url(#hb-blur-think)"/>

    <!-- Receipt slot mouth with small tip poking out -->
    <rect x="86" y="132" width="28" height="3" rx="1.5" fill="#2b2622"/>
    <rect x="92" y="135" width="16" height="5" rx="1" fill="#ffffff" stroke="#2b2622" stroke-width="1"/>

    <!-- Telescoping neck (segmented collar rings) -->
    <rect x="88" y="110" width="24" height="4" rx="2" fill="#665c52" stroke="var(--robot-out)" stroke-width="2"/>
    <rect x="85" y="114" width="30" height="4" rx="2" fill="#887b6d" stroke="var(--robot-out)" stroke-width="2"/>
    <rect x="88" y="118" width="24" height="4" rx="2" fill="#665c52" stroke="var(--robot-out)" stroke-width="2"/>

    <!-- Tilted Head Dome (inquisitive) -->
    <g class="bot-head-think">
      <path d="M56 82 C56 52 74 38 100 38 C126 38 144 52 144 82 C144 104 128 112 100 112 C72 112 56 104 56 82 Z"
            fill="url(#hb-body-think)" stroke="var(--robot-out)" stroke-width="3.5"/>

      <!-- Top antenna curl -->
      <path d="M100 38 C98 24 106 18 104 12" fill="none" stroke="var(--robot-out)" stroke-width="3.5" stroke-linecap="round"/>
      <circle class="antenna-ball-think" cx="104" cy="11" r="5" fill="#ff9a3c" stroke="var(--robot-out)" stroke-width="2"/>

      <!-- Dark Goggle Faceplate -->
      <rect x="66" y="58" width="68" height="38" rx="19" fill="#1e1814" stroke="var(--robot-out)" stroke-width="2.5"/>

      <!-- Dual Camera Eyes (looking up & right in thought) -->
      <!-- Left Lens -->
      <circle cx="83" cy="77" r="14" fill="#2d2218" stroke="#ffaa33" stroke-width="2"/>
      <circle cx="86" cy="74" r="7" fill="#ffaa33"/>
      <circle cx="87" cy="73" r="3.5" fill="#1e1814"/>
      <circle cx="89" cy="71" r="2" fill="#ffffff"/>

      <!-- Right Lens -->
      <circle cx="117" cy="77" r="14" fill="#2d2218" stroke="#ffaa33" stroke-width="2"/>
      <circle cx="120" cy="74" r="7" fill="#ffaa33"/>
      <circle cx="121" cy="73" r="3.5" fill="#1e1814"/>
      <circle cx="123" cy="71" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
