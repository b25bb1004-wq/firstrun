<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="humble-robot humble-robot-think" aria-label="HUMBLE Robot: Thinking">
  <defs>
    <filter id="blur-think" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bloom-think" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lines-think" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffc47a" opacity="0.09"/>
    </pattern>
    <clipPath id="scr-think"><rect x="46" y="34" width="108" height="80" rx="18"/></clipPath>
  </defs>
  <style>
    :root {
      --core: #ff9a3c; --hi: #ffc47a; --deep: #e0701c;
      --out: #3a1c0a; --screen: #2a1406; --blue: #2440ff; --pink: #ff2d87;
    }
    .halo { filter: url(#blur-think); opacity: 0.38; }
    .bot-head { transform-origin: 100px 124px; animation: hb-think-tilt 2.4s ease-in-out infinite; }
    .antenna-ball { animation: hb-think-pulse 1.6s ease-in-out infinite alternate; }
    @keyframes hb-think-tilt {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes hb-think-pulse {
      0% { fill: var(--hi, #ffc47a); filter: drop-shadow(0 0 4px var(--hi, #ffc47a)); }
      100% { fill: var(--blue, #2440ff); filter: drop-shadow(0 0 8px var(--blue, #2440ff)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bot-head, .antenna-ball { animation: none !important; }
    }
  </style>
  <g class="bot-body">
    <!-- Amber halo glow -->
    <g class="halo" fill="var(--core, #ff9a3c)">
      <rect x="32" y="20" width="136" height="108" rx="30"/>
      <ellipse cx="100" cy="170" rx="44" ry="40"/>
    </g>
    <!-- Legs (rubber hose) -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="9" stroke-linecap="round">
      <path d="M86 196 Q84 214 80 228"/>
      <path d="M114 196 Q116 214 120 228"/>
    </g>
    <g fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <ellipse cx="76" cy="231" rx="13" ry="7"/>
      <ellipse cx="124" cy="231" rx="13" ry="7"/>
    </g>
    <!-- Body & chest light -->
    <path d="M100 136 C128 136 140 158 138 178 C136 198 120 206 100 206 C80 206 64 198 62 178 C60 158 72 136 100 136Z" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
    <circle cx="100" cy="168" r="7" fill="var(--hi, #ffc47a)" filter="url(#bloom-think)"/>
    <!-- Thoughtful arm pose: left hand near chin, right arm resting -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round">
      <path d="M66 158 Q52 142 66 122"/>
      <path d="M134 158 Q152 170 154 188"/>
    </g>
    <g fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <circle cx="68" cy="120" r="9"/>
      <circle cx="154" cy="192" r="9"/>
    </g>
    <!-- Neck -->
    <rect x="88" y="124" width="24" height="14" rx="4" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Head: CRT screen with tilt animation -->
    <g class="bot-head">
      <rect x="36" y="24" width="128" height="100" rx="28" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
      <rect x="46" y="34" width="108" height="80" rx="18" fill="var(--screen, #2a1406)"/>
      <g clip-path="url(#scr-think)">
        <g filter="url(#bloom-think)" stroke-linecap="round" fill="none">
          <!-- Focused upward-left looking eyes -->
          <g fill="var(--hi, #ffc47a)">
            <ellipse cx="76" cy="66" rx="9" ry="9"/>
            <ellipse cx="116" cy="66" rx="9" ry="9"/>
          </g>
          <!-- Concentrated pensive mouth -->
          <path d="M86 96 L114 96" stroke="var(--hi, #ffc47a)" stroke-width="4"/>
        </g>
        <rect x="46" y="34" width="108" height="80" fill="url(#lines-think)"/>
      </g>
      <!-- Glass glare -->
      <rect x="54" y="40" width="30" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
      <!-- Antenna with pulsing bulb -->
      <g id="ant">
        <path d="M100 24 L94 4" stroke="var(--out, #3a1c0a)" stroke-width="4" stroke-linecap="round"/>
        <circle class="antenna-ball hb-antenna-ball" cx="93" cy="2" r="8" fill="var(--hi, #ffc47a)" stroke="var(--out, #3a1c0a)" stroke-width="3" filter="url(#bloom-think)"/>
      </g>
    </g>
  </g>
</svg>
