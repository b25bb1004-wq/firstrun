<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -25 200 275" class="humble-robot humble-robot-celebrate" aria-label="HUMBLE Robot: Celebrating">
  <defs>
    <filter id="blur-celeb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bloom-celeb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lines-celeb" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffc47a" opacity="0.09"/>
    </pattern>
    <clipPath id="scr-celeb"><rect x="46" y="34" width="108" height="80" rx="18"/></clipPath>
  </defs>
  <style>
    :root {
      --core: #ff9a3c; --hi: #ffc47a; --deep: #e0701c;
      --out: #3a1c0a; --screen: #2a1406; --blue: #2440ff; --pink: #ff2d87;
    }
    .halo { filter: url(#blur-celeb); opacity: 0.45; }
    .bot-celebrate-jump {
      transform-origin: 100px 238px;
      animation: hb-jump-squash 1.2s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }
    .screen-flash-blue {
      animation: hb-flash-blue 1.2s ease-in-out infinite;
    }
    .antenna-wobble {
      transform-origin: 100px 24px;
      animation: hb-ant-wobble 0.6s ease-in-out infinite alternate;
    }
    @keyframes hb-jump-squash {
      0% { transform: translateY(0) scale(1, 1); }
      15% { transform: translateY(6px) scale(1.12, 0.86); }
      45% { transform: translateY(-20px) scale(0.92, 1.12); }
      75% { transform: translateY(0) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes hb-flash-blue {
      0%, 30% { opacity: 0; }
      50% { opacity: 0.55; }
      70%, 100% { opacity: 0; }
    }
    @keyframes hb-ant-wobble {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bot-celebrate-jump, .screen-flash-blue, .antenna-wobble { animation: none !important; }
      .screen-flash-blue { opacity: 0.25; }
    }
  </style>
  <g class="bot-celebrate-jump">
    <!-- Amber halo glow -->
    <g class="halo" fill="var(--core, #ff9a3c)">
      <rect x="32" y="20" width="136" height="108" rx="30"/>
      <ellipse cx="100" cy="170" rx="44" ry="40"/>
    </g>
    <!-- Legs (rubber hose) -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="9" stroke-linecap="round">
      <path d="M86 196 Q84 214 80 228"/>
      <path d="M114 196 Q116 214 120 228"/>
    </g>
    <g fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <ellipse cx="76" cy="231" rx="13" ry="7"/>
      <ellipse cx="124" cy="231" rx="13" ry="7"/>
    </g>
    <!-- Body & chest light -->
    <path d="M100 136 C128 136 140 158 138 178 C136 198 120 206 100 206 C80 206 64 198 62 178 C60 158 72 136 100 136Z" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
    <circle cx="100" cy="168" r="7" fill="var(--hi, #ffc47a)" filter="url(#bloom-celeb)"/>
    <!-- Raised arms in victory -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round">
      <path d="M66 158 Q40 140 38 112"/>
      <path d="M134 158 Q160 140 162 112"/>
    </g>
    <g fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <circle cx="36" cy="108" r="9"/>
      <circle cx="164" cy="108" r="9"/>
    </g>
    <!-- Neck -->
    <rect x="88" y="124" width="24" height="14" rx="4" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Head: CRT screen -->
    <g id="head">
      <rect x="36" y="24" width="128" height="100" rx="28" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
      <rect x="46" y="34" width="108" height="80" rx="18" fill="var(--screen, #2a1406)"/>
      <g clip-path="url(#scr-celeb)">
        <g filter="url(#bloom-celeb)" stroke-linecap="round" fill="none">
          <!-- Happy crescent curved eyes -->
          <g fill="var(--hi, #ffc47a)">
            <ellipse cx="80" cy="68" rx="9" ry="6"/>
            <ellipse cx="120" cy="68" rx="9" ry="6"/>
          </g>
          <!-- Wide ecstatic victory smile -->
          <path d="M80 92 Q100 114 120 92" stroke="var(--hi, #ffc47a)" stroke-width="4.5"/>
        </g>
        <rect x="46" y="34" width="108" height="80" fill="url(#lines-celeb)"/>
        <!-- Blue screen celebration flash (no confetti) -->
        <rect class="screen-flash-blue" x="46" y="34" width="108" height="80" fill="var(--blue, #2440ff)"/>
      </g>
      <!-- Glass glare -->
      <rect x="54" y="40" width="30" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
      <!-- Antenna with wobble -->
      <g class="antenna-wobble">
        <path d="M100 24 L94 4" stroke="var(--out, #3a1c0a)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="93" cy="2" r="8" fill="var(--hi, #ffc47a)" stroke="var(--out, #3a1c0a)" stroke-width="3" filter="url(#bloom-celeb)"/>
      </g>
    </g>
  </g>
</svg>
