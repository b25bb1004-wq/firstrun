services:
  app:
    image: python:3.12
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    network_mode: service:app
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
