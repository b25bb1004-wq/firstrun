[project]
name = "quill-notes-api"
version = "0.6.2"
description = "A tiny self-hosted notes API backed by SQLite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.33",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["notes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
