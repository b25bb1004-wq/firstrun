    <!-- 1. SLEEP -->
    <symbol id="hb-robot-sleep" viewBox="0 0 80 80">
      <g fill="#8c867a" font-family="'IBM Plex Mono', monospace" font-weight="600">
        <text x="56" y="14" font-size="8" class="hb-z1">z</text>
        <text x="63" y="8" font-size="10" class="hb-z2">Z</text>
