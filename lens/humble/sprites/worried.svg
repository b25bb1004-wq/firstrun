<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="humble-robot humble-robot-worried" aria-label="HUMBLE Lamplighter: Worried">
  <defs>
    <filter id="hb-blur-worried" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="hb-disc-worried" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff65a5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff2d87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-lantern-worried" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff65a5" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ff2d87" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ba1b5c" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="hb-body-worried" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#dbd0be"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      --robot-core: #ff9a3c; --robot-hi: #ffc47a; --robot-deep: #e0701c;
      --robot-out: #2b2622; --robot-screen: #2a1406; --robot-blue: #2440ff; --robot-pink: #ff2d87;
    }
    .bot-worried-shiver { animation: hb-nervous-shiver 0.16s linear infinite; }
    .antenna-pink-pulse { animation: hb-pink-pulse 0.8s ease-in-out infinite alternate; }
    @keyframes hb-nervous-shiver {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(1px, 1px); }
    }
    @keyframes hb-pink-pulse {
      0% { fill: var(--robot-pink); }
      100% { fill: #ff65a5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bot-worried-shiver, .antenna-pink-pulse { animation: none !important; }
    }
  </style>

  <!-- Pink hover disc -->
  <ellipse cx="100" cy="236" rx="34" ry="6" fill="url(#hb-disc-worried)"/>

  <g class="bot-worried-shiver">
    <!-- Sweat droplets -->
    <path d="M52 64 C49 60 55 56 55 60 C55 64 52 66 52 64 Z" fill="#4589ff" opacity="0.85"/>
    <path d="M148 64 C151 60 145 56 145 60 C145 64 148 66 148 64 Z" fill="#4589ff" opacity="0.85"/>

    <!-- Backpack with agent cartridges -->
    <rect x="74" y="128" width="52" height="48" rx="8" fill="#242b35" stroke="var(--robot-out)" stroke-width="3"/>
    <rect x="78" y="134" width="7" height="12" rx="2" fill="#4589ff"/>
    <rect x="89" y="134" width="7" height="12" rx="2" fill="#8a3ffc"/>
    <rect x="100" y="134" width="7" height="12" rx="2" fill="#0072c3"/>
    <rect x="111" y="134" width="7" height="12" rx="2" fill="#fa4d56"/>
    <rect x="84" y="152" width="7" height="12" rx="2" fill="#1192e8"/>
    <rect x="95" y="152" width="7" height="12" rx="2" fill="#009d9a"/>

    <!-- Left Arm (clutching inward nervously) -->
    <path d="M62 144 Q56 166 72 176" fill="none" stroke="var(--robot-out)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="73" cy="177" r="8" fill="#f0e9dd" stroke="var(--robot-out)" stroke-width="2.5"/>

    <!-- Right Arm (clutching inward nervously) -->
    <path d="M138 144 Q144 166 128 176" fill="none" stroke="var(--robot-out)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="127" cy="177" r="8" fill="#f0e9dd" stroke="var(--robot-out)" stroke-width="2.5"/>

    <!-- Capsule Body -->
    <rect x="58" y="122" width="84" height="92" rx="42" fill="url(#hb-body-worried)" stroke="var(--robot-out)" stroke-width="3.5"/>

    <!-- Worried Hot Pink Belly Lantern -->
    <path d="M74 168 C74 150 86 142 100 142 C114 142 126 150 126 168 C126 186 114 196 100 196 C86 196 74 186 74 168 Z"
          fill="url(#hb-lantern-worried)" stroke="var(--robot-out)" stroke-width="2.5"/>
    <circle cx="100" cy="168" r="14" fill="#ff65a5" opacity="0.65" filter="url(#hb-blur-worried)"/>

    <!-- Receipt slot mouth (nervous wavy jitter) -->
    <path d="M86 133 Q93 130 100 133 Q107 136 114 133" fill="none" stroke="var(--robot-out)" stroke-width="3" stroke-linecap="round"/>

    <!-- Telescoping neck (segmented collar rings) -->
    <rect x="88" y="112" width="24" height="4" rx="2" fill="#665c52" stroke="var(--robot-out)" stroke-width="2"/>
    <rect x="85" y="116" width="30" height="4" rx="2" fill="#887b6d" stroke="var(--robot-out)" stroke-width="2"/>
    <rect x="88" y="120" width="24" height="4" rx="2" fill="#665c52" stroke="var(--robot-out)" stroke-width="2"/>

    <!-- Head Dome -->
    <path d="M56 82 C56 52 74 38 100 38 C126 38 144 52 144 82 C144 104 128 112 100 112 C72 112 56 104 56 82 Z"
          fill="url(#hb-body-worried)" stroke="var(--robot-out)" stroke-width="3.5"/>

    <!-- Top antenna with pink panic pulse -->
    <path d="M100 38 C98 24 106 18 104 12" fill="none" stroke="var(--robot-out)" stroke-width="3.5" stroke-linecap="round"/>
    <circle class="antenna-pink-pulse" cx="104" cy="11" r="5" fill="#ff2d87" stroke="var(--robot-out)" stroke-width="2"/>

    <!-- Dark Goggle Faceplate -->
    <rect x="66" y="58" width="68" height="38" rx="19" fill="#1e1814" stroke="var(--robot-out)" stroke-width="2.5"/>

    <!-- Dual Camera Eyes (wide, anxious, trembling pupils) -->
    <circle cx="83" cy="77" r="14" fill="#2d2218" stroke="#ff2d87" stroke-width="2"/>
    <circle cx="83" cy="78" r="6" fill="#ff2d87"/>
    <circle cx="83" cy="78" r="3" fill="#1e1814"/>
    <circle cx="85" cy="76" r="1.8" fill="#ffffff"/>

    <circle cx="117" cy="77" r="14" fill="#2d2218" stroke="#ff2d87" stroke-width="2"/>
    <circle cx="117" cy="78" r="6" fill="#ff2d87"/>
    <circle cx="117" cy="78" r="3" fill="#1e1814"/>
    <circle cx="119" cy="76" r="1.8" fill="#ffffff"/>
  </g>
</svg>
