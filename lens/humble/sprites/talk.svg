<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="humble-robot humble-robot-talk" aria-label="HUMBLE Robot: Talking">
  <defs>
    <filter id="blur-talk" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bloom-talk" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lines-talk" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffc47a" opacity="0.09"/>
    </pattern>
    <clipPath id="scr-talk"><rect x="46" y="34" width="108" height="80" rx="18"/></clipPath>
  </defs>
  <style>
    :root {
      --core: #ff9a3c; --hi: #ffc47a; --deep: #e0701c;
      --out: #3a1c0a; --screen: #2a1406; --blue: #2440ff; --pink: #ff2d87;
    }
    .halo { filter: url(#blur-talk); opacity: 0.38; }
    .bot-head-nod { transform-origin: 100px 124px; animation: hb-talk-nod 0.9s ease-in-out infinite alternate; }
    .arm-gesture { transform-origin: 66px 158px; animation: hb-talk-gesture 1.2s ease-in-out infinite alternate; }
    .talk-mouth { animation: hb-talk-viseme 0.44s ease-in-out infinite alternate; }
    @keyframes hb-talk-nod {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(3deg); }
    }
    @keyframes hb-talk-gesture {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-8deg); }
    }
    @keyframes hb-talk-viseme {
      0% { transform: scaleY(1); }
      50% { transform: scaleY(1.4) translateY(-1px); }
      100% { transform: scaleY(0.8) translateY(1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bot-head-nod, .arm-gesture, .talk-mouth { animation: none !important; }
    }
  </style>
  <g class="bot-body">
    <!-- Amber halo glow -->
    <g class="halo" fill="var(--core, #ff9a3c)">
      <rect x="32" y="20" width="136" height="108" rx="30"/>
      <ellipse cx="100" cy="170" rx="44" ry="40"/>
    </g>
    <!-- Legs (rubber hose) -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="9" stroke-linecap="round">
      <path d="M86 196 Q84 214 80 228"/>
      <path d="M114 196 Q116 214 120 228"/>
    </g>
    <g fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <ellipse cx="76" cy="231" rx="13" ry="7"/>
      <ellipse cx="124" cy="231" rx="13" ry="7"/>
    </g>
    <!-- Body & chest light -->
    <path d="M100 136 C128 136 140 158 138 178 C136 198 120 206 100 206 C80 206 64 198 62 178 C60 158 72 136 100 136Z" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
    <circle cx="100" cy="168" r="7" fill="var(--hi, #ffc47a)" filter="url(#bloom-talk)"/>
    <!-- Gesturing left arm + resting right arm -->
    <g class="arm-gesture">
      <path d="M66 158 Q46 150 48 134" fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="48" cy="130" r="9" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    </g>
    <path d="M134 158 Q152 170 154 188" fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="154" cy="192" r="9" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Neck -->
    <rect x="88" y="124" width="24" height="14" rx="4" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Head: CRT screen with nod animation -->
    <g class="bot-head-nod">
      <rect x="36" y="24" width="128" height="100" rx="28" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
      <rect x="46" y="34" width="108" height="80" rx="18" fill="var(--screen, #2a1406)"/>
      <g clip-path="url(#scr-talk)">
        <g filter="url(#bloom-talk)" stroke-linecap="round" fill="none">
          <!-- Expressive eyes -->
          <g fill="var(--hi, #ffc47a)">
            <ellipse cx="80" cy="70" rx="9" ry="12"/>
            <ellipse cx="120" cy="70" rx="9" ry="12"/>
          </g>
          <!-- Articulated speaking mouth -->
          <g class="talk-mouth" style="transform-origin: 100px 96px;">
            <path d="M84 94 Q100 110 116 94" stroke="var(--hi, #ffc47a)" stroke-width="4"/>
          </g>
        </g>
        <rect x="46" y="34" width="108" height="80" fill="url(#lines-talk)"/>
      </g>
      <!-- Glass glare -->
      <rect x="54" y="40" width="30" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
      <!-- Antenna with ball -->
      <g id="ant">
        <path d="M100 24 L94 4" stroke="var(--out, #3a1c0a)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="93" cy="2" r="8" fill="var(--hi, #ffc47a)" stroke="var(--out, #3a1c0a)" stroke-width="3" filter="url(#bloom-talk)"/>
      </g>
    </g>
  </g>
</svg>
