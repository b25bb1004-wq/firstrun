<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" class="humble-robot humble-robot-point" aria-label="HUMBLE Robot: Pointing">
  <defs>
    <style>
      .hb-ink { stroke: #16181b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .hb-body { fill: #eae4d7; }
      .hb-plate { fill: #dfd7c8; }
      .hb-accent-blue { fill: #0f62fe; }
      .hb-accent-pink { fill: #f06292; }
      .hb-point-pulse { transform-origin: 75px 44px; animation: humble-point-pulse 1.2s ease-out infinite; }
      .hb-arm-subtle { transform-origin: 55px 46px; animation: humble-point-arm 2s ease-in-out infinite; }
      @keyframes humble-point-pulse {
        0% { r: 2px; opacity: 1; }
        100% { r: 8px; opacity: 0; stroke-width: 1.5; }
      }
      @keyframes humble-point-arm {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hb-point-pulse, .hb-arm-subtle { animation: none; }
      }
    </style>
  </defs>

  <!-- Feet -->
  <rect x="27" y="66" width="10" height="7" rx="3.5" class="hb-ink" fill="#16181b" />
  <rect x="43" y="66" width="10" height="7" rx="3.5" class="hb-ink" fill="#16181b" />

  <!-- Torso -->
  <rect x="25" y="42" width="30" height="23" rx="6" class="hb-ink hb-body" />
  <rect x="29" y="46" width="22" height="15" rx="3" class="hb-ink hb-plate" stroke-width="1.5" />
  <circle cx="35" cy="53" r="2.5" class="hb-accent-blue" />
  <circle cx="45" cy="53" r="2.5" class="hb-accent-pink" />

  <!-- Left Arm (anchored on hip) -->
  <path d="M 25 46 Q 18 50 22 56" class="hb-ink" fill="none" />
  <circle cx="22" cy="56" r="2.5" class="hb-ink hb-body" />

  <!-- Extended Pointing Right Arm -->
  <g class="hb-arm-subtle">
    <!-- Arm segment extending to the right -->
    <path d="M 54 46 L 70 44" class="hb-ink" stroke-width="3" />
    <!-- Hand base -->
    <circle cx="70" cy="44" r="3" class="hb-ink hb-body" />
    <!-- Pointing finger / stylus -->
    <line x1="72" y1="44" x2="76" y2="44" class="hb-ink" stroke-width="2.5" />
    <!-- Pointer pulse beacon -->
    <circle cx="76" cy="44" r="3" class="hb-point-pulse" fill="none" stroke="#0f62fe" />
    <circle cx="76" cy="44" r="2" class="hb-accent-blue" />
  </g>

  <!-- Neck -->
  <rect x="35" y="38" width="10" height="4" class="hb-ink hb-plate" />

  <!-- Antenna -->
  <line x1="40" y1="13" x2="40" y2="6" class="hb-ink" />
  <circle cx="40" cy="5" r="4.5" class="hb-ink hb-accent-blue" />

  <!-- Head & Ears -->
  <rect x="15" y="22" width="3" height="8" rx="1.5" class="hb-ink hb-plate" />
  <rect x="62" y="22" width="3" height="8" rx="1.5" class="hb-ink hb-plate" />
  <rect x="18" y="13" width="44" height="26" rx="9" class="hb-ink hb-body" />

  <!-- Visor -->
  <rect x="23" y="18" width="34" height="15" rx="5" class="hb-ink hb-plate" stroke-width="1.5" />

  <!-- Sharp Focused Eyes (looking toward the right) -->
  <circle cx="36" cy="25" r="3" class="hb-ink" fill="#16181b" />
  <circle cx="37" cy="24" r="1" fill="#eae4d7" />
  <circle cx="50" cy="25" r="3" class="hb-ink" fill="#16181b" />
  <circle cx="51" cy="24" r="1" fill="#eae4d7" />

  <!-- Directing Mouth -->
  <path d="M 37 30 Q 42 32 46 29" class="hb-ink" stroke-width="1.8" fill="none" />
</svg>
