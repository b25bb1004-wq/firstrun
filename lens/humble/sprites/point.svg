<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="humble-robot humble-robot-point" aria-label="HUMBLE Robot: Pointing">
  <defs>
    <filter id="blur-point" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bloom-point" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lines-point" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffc47a" opacity="0.09"/>
    </pattern>
    <clipPath id="scr-point"><rect x="46" y="34" width="108" height="80" rx="18"/></clipPath>
  </defs>
  <style>
    :root {
      --core: #ff9a3c; --hi: #ffc47a; --deep: #e0701c;
      --out: #3a1c0a; --screen: #2a1406; --blue: #2440ff; --pink: #ff2d87;
    }
    .halo { filter: url(#blur-point); opacity: 0.38; }
    .point-beacon { animation: hb-beacon-ping 1.4s ease-out infinite; transform-origin: 196px 146px; }
    .bot-point-hover { animation: hb-point-hover 2.8s ease-in-out infinite alternate; }
    @keyframes hb-beacon-ping {
      0% { r: 5; opacity: 0.9; stroke-width: 2; }
      100% { r: 16; opacity: 0; stroke-width: 1; }
    }
    @keyframes hb-point-hover {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .point-beacon, .bot-point-hover { animation: none !important; }
      .point-beacon { opacity: 0.6; r: 8; }
    }
  </style>
  <g class="bot-point-hover">
    <!-- Amber halo glow -->
    <g class="halo" fill="var(--core, #ff9a3c)">
      <rect x="32" y="20" width="136" height="108" rx="30"/>
      <ellipse cx="100" cy="170" rx="44" ry="40"/>
    </g>
    <!-- Legs (rubber hose) -->
    <g fill="none" stroke="var(--out, #3a1c0a)" stroke-width="9" stroke-linecap="round">
      <path d="M86 196 Q84 214 80 228"/>
      <path d="M114 196 Q116 214 120 228"/>
    </g>
    <g fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3">
      <ellipse cx="76" cy="231" rx="13" ry="7"/>
      <ellipse cx="124" cy="231" rx="13" ry="7"/>
    </g>
    <!-- Body & chest light -->
    <path d="M100 136 C128 136 140 158 138 178 C136 198 120 206 100 206 C80 206 64 198 62 178 C60 158 72 136 100 136Z" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
    <circle cx="100" cy="168" r="7" fill="var(--hi, #ffc47a)" filter="url(#bloom-point)"/>
    <!-- Left arm at hip / side -->
    <path d="M66 158 Q50 172 48 188" fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="48" cy="190" r="9" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Right arm pointing forward -->
    <path d="M134 158 Q168 150 196 146" fill="none" stroke="var(--out, #3a1c0a)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="196" cy="146" r="9" fill="var(--core, #ff9a3c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Radar beacon pulse at pointer tip -->
    <circle cx="196" cy="146" r="4" fill="var(--hi, #ffc47a)" filter="url(#bloom-point)"/>
    <circle class="point-beacon" cx="196" cy="146" r="6" fill="none" stroke="var(--hi, #ffc47a)"/>
    <!-- Neck -->
    <rect x="88" y="124" width="24" height="14" rx="4" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3"/>
    <!-- Head: CRT screen -->
    <g id="head">
      <rect x="36" y="24" width="128" height="100" rx="28" fill="var(--deep, #e0701c)" stroke="var(--out, #3a1c0a)" stroke-width="3.5"/>
      <rect x="46" y="34" width="108" height="80" rx="18" fill="var(--screen, #2a1406)"/>
      <g clip-path="url(#scr-point)">
        <g filter="url(#bloom-point)" stroke-linecap="round" fill="none">
          <!-- Eyes looking to the right towards pointing target -->
          <g fill="var(--hi, #ffc47a)">
            <ellipse cx="84" cy="70" rx="9" ry="12"/>
            <ellipse cx="124" cy="70" rx="9" ry="12"/>
          </g>
          <!-- Friendly reassuring smile -->
          <path d="M84 94 Q100 104 116 94" stroke="var(--hi, #ffc47a)" stroke-width="4"/>
        </g>
        <rect x="46" y="34" width="108" height="80" fill="url(#lines-point)"/>
      </g>
      <!-- Glass glare -->
      <rect x="54" y="40" width="30" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
    </g>
    <!-- Antenna with ball -->
    <g id="ant">
      <path d="M100 24 L94 4" stroke="var(--out, #3a1c0a)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="93" cy="2" r="8" fill="var(--hi, #ffc47a)" stroke="var(--out, #3a1c0a)" stroke-width="3" filter="url(#bloom-point)"/>
    </g>
  </g>
</svg>
