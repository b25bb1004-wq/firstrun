<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src data:">
<title>HUMBLE Lens</title>
<style>
  :root {
    --panel: #132035; --panel-2: #192a43; --rule: #2f4667; --ink: #E6ECF5; --ink-2: #A3B4CB; --ink-3: #6D819D;
    --pass: #3DD68C; --pass-t: rgba(61,214,140,.12); --bob: #5E9EFF; --bob-t: rgba(94,158,255,.14); --fail: #FF6167; --fail-t: rgba(255,97,103,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--ink); user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(10,17,29,.88); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 16px; font-size: 13px; color: var(--ink-2); pointer-events: none; transition: opacity .2s; }
  .hint b { color: var(--pass); font-weight: 600; }
  .card { position: fixed; width: 380px; max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.8); padding: 14px 16px 16px; user-select: text; cursor: default; }
  .card[hidden] { display: none; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .top .brand { font-weight: 600; font-size: 13px; letter-spacing: .02em; }
  .top .proj { color: var(--ink-3); font-size: 12px; }
  .top button { margin-left: auto; background: none; border: 0; color: var(--ink-3); font-size: 18px; cursor: pointer; line-height: 1; }
  .status { color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--pass); border-radius: 50%; animation: s 0.8s linear infinite; flex: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  .block { border-radius: 10px; padding: 10px 12px; margin: 10px 0 0; }
  .block.known { background: var(--pass-t); border-left: 3px solid var(--pass); }
  .block.bob { background: var(--bob-t); border-left: 3px solid var(--bob); }
  .block.err { background: var(--fail-t); border-left: 3px solid var(--fail); }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .known .label { color: var(--pass); } .bob .label { color: var(--bob); } .err .label { color: var(--fail); }
  .meta { color: var(--ink-3); font-size: 12px; margin-top: 6px; }
  .cmd { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; }
  .cmd code { flex: 1; background: rgba(0,0,0,.3); border-radius: 6px; padding: 6px 8px; font: 12.5px Consolas, "IBM Plex Mono", monospace; white-space: pre-wrap; word-break: break-word; }
  .cmd button, .chip { background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-2); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .cmd button:hover, .chip:hover { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  details { margin-top: 10px; color: var(--ink-2); }
  details summary { cursor: pointer; font-size: 12px; color: var(--ink-3); }
  details pre { max-height: 140px; overflow: auto; background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px; font: 12px Consolas, monospace; white-space: pre-wrap; margin: 6px 0 0; }
  form { display: flex; gap: 6px; margin-top: 12px; }
  form input { flex: 1; min-width: 0; background: rgba(0,0,0,.3); border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); padding: 8px 10px; font: inherit; }
  form input:focus { outline: 2px solid var(--bob); outline-offset: 0; }
  form button { background: var(--bob); color: #04122B; border: 0; border-radius: 8px; padding: 0 12px; font-weight: 600; cursor: pointer; }
  form button[disabled] { opacity: .5; cursor: progress; }
  .files { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font: 12px Consolas, monospace; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hint" id="hint"><b>Circle anything</b> to ask about it · Esc to close</div>
  <div class="card" id="card" hidden>
    <div class="top"><span class="brand">◎ HUMBLE Lens</span><span class="proj" id="proj"></span><button id="x" title="Close (Esc)" aria-label="Close">×</button></div>
    <div id="body"></div>
    <form id="ask">
      <input id="q" placeholder="Ask about what you circled…" autocomplete="off">
      <button id="send" type="submit">Ask Bob</button>
    </form>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
